unit_tests:
  - name: unittest_fullmoon_matcher
    model: mart_fullmoon_reviews
    given:
      - input: ref('fct_reviews')
        rows:
          - {date_review: '2025-01-13'}
          - {date_review: '2025-01-14'}
          - {date_review: '2025-01-15'}
      - input: ref('seed_full_moon_dates')
        rows:
          - {full_moon_date: '2025-01-14'}
    expect:
      rows:
        - {date_review: '2025-01-13', is_full_moon: 'not full moon'}
        - {date_review: '2025-01-14', is_full_moon: 'not full moon'}
        - {date_review: '2025-01-15', is_full_moon: 'full moon'}