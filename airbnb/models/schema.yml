models:

# ------- dim_listings_cleansed -------

  - name: dim_listings_cleansed
    data_tests:
      - minimum_row_count:
          arguments:
            min_row_count: 1_000
          severity: error

    columns:

      - name: listing_id
        data_tests:
          - unique
          - not_null
      
      - name: host_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hosts_cleansed')
                field: host_id

      - name: room_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['Entire home/apt', 'Private room', 'Shared room', 'Hotel room']
      
      - name: minimum_nights
        data_tests:
          - positive_values

# ------- dim_hosts_cleansed -------

  - name: dim_hosts_cleansed
  
    config:
      contract: 
        enforced: true
    constraints:
      - type: primary_key
        columns: [host_id]

    columns:
      - name: host_id
        data_type: integer
        constraints:
          - type: not_null
          - type: unique
        data_tests:
          - unique
          - not_null

      - name: host_name
        data_type: string
        constraints:
          - type: not_null
        data_tests:
          - not_null

      - name: is_superhost
        data_type: string
        data_tests:
          - accepted_values:
              arguments:
                values: ['t', 'f']

      - name: created_at
        data_type: timestamp

      - name: updated_at
        data_type: timestamp

# ------- fct_reviews -------

  - name: fct_reviews
    columns:

      - name: listing_id
        data_tests:
          - not_null
      
      - name: review_text
        data_tests:
          - not_null
      
      - name: review_sentiment
        data_tests:
          - accepted_values:
              arguments:
                values: ['positive', 'neutral', 'negative']

                
