models:
  - name: dim_listing_cleansed
    description: "This model contains the cleansed listing data from Airbnb."
    data_tests:
      - minimum_rowcount:
          arguments:
            min_rows: 100
    columns:
      - name: listing_id
        description: "The unique identifier for each listing."
        data_tests:
          - not_null
          - unique
      - name: host_id
        description: "The unique identifier for each host."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hosts_cleansed')
                field: host_id

      - name: room_type
        description: "The type of room available for booking."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Entire home/apt', 'Private room', 'Shared room', 'Hotel room']
      - name: price
        description: "The price per night for the listing."
        data_tests:
          - not_null
      - name: minimum_nights
        description: '{{ doc("dim_listing_cleansed__minimum_nights") }}'
        data_tests:
          - not_null
          - positive_values
  - name: dim_hosts_cleansed
    versions:
      - v: 1
        defined_in: dim_hosts_cleansed
        deprecation_date: 2030-01-01
      - v: 2
        columns:
         - include: "*"
           exclude: [host_name]
         - name: host_name
           description: "The name of the host. (Default is  N/A)"
           dataype: string  
           constraints:
             - type: not_null
    latest_version: 2
    description: "This model contains the cleansed host data from Airbnb."
    columns:
      - name: host_id
        description: "The unique identifier for each host."
        data_tests:
          - not_null
          - unique
      - name: host_name
        description: "The name of the host."
        data_tests:
          - not_null
      - name: is_superhost
        description: "Indicates whether the host is a superhost."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['t', 'f']
  - name: dim_host_w_listings
    config:
        contract: 
          enforced: true
    columns:
      - name: listing_id
        data_type: integer
        constraints:
          - type: not_null
      - name: listing_name
        data_type: string
      - name: room_type
        data_type: string
      - name: minimum_nights
        data_type: integer
      - name: price
        data_type: NUMBER(10,2)
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 8000
                config:
                  severity: warn
          - dbt_expectations.expect_column_values_to_be_of_type:
              arguments:
                column_type: NUMBER
      - name: price_str
        data_type: string
      - name: host_id
        data_type: integer
      - name: host_name
        data_type: string
      - name: host_is_superhost
        data_type: string
      - name: created_at
        data_type: timestamp
      - name: updated_at
        data_type: timestamp
    data_tests:
      - dbt_expectations.expect_table_row_count_to_equal_other_table::
          arguments:
            compare_model: source('airbnb','listings')
