models:

# ------- dim_listings_cleansed -------

  - name: dim_listings_cleansed
    description: Cleansed table which contain Airbnb listings.
    data_tests:
      - minimum_row_count:
          arguments:
            min_row_count: 1_000
          severity: error

    columns:

      - name: listing_id
        description: Primary key for the listing
        data_tests:
          - unique
          - not_null
      
      - name: host_id
        description: The host's id. References the host table.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hosts_cleansed')
                field: host_id

      - name: room_type
        description: Type of apartment / room
        data_tests:
          - accepted_values:
              arguments:
                values: ['Entire home/apt', 'Private room', 'Shared room', 'Hotel room']
      
      - name: minimum_nights
        description: '{{ doc("dim_listing_cleansed_minimum_nights") }}'
        data_tests:
          - positive_values

# ------- dim_hosts_cleansed -------

  - name: dim_hosts_cleansed
    description: Cleansed table which contain Airbnb hosts.
    config:
      contract: 
        enforced: true

    columns:
      - name: host_id
        description: The host id, primary key for this table.
        data_type: integer
        constraints:
          - type: not_null
        data_tests:
          - unique

      - name: host_name
        description: The name of the host.
        data_type: string
        constraints:
          - type: not_null

      - name: is_superhost
        description: t if the hosts reviews are good.
        data_type: string
        data_tests:
          - accepted_values:
              arguments:
                values: ['t', 'f']

      - name: created_at
        data_type: timestamp

      - name: updated_at
        data_type: timestamp

  - name: dim_listings_w_hosts
    tests:
      - dbt_expectations.expect_table_row_count_to_equal_other_table:
          compare_model: source('airbnb', 'listings')

    columns:
      - name: price
        tests:
          - dbt_expectations.expect_column_values_to_be_of_type:
              column_type: number
          - dbt_expectations.expect_column_quantile_values_to_be_between:
              quantile: .99
              min_value: 50 # (Optional)
              max_value: 500 # (Optional)

          - dbt_expectations.expect_column_max_to_be_between:
              max_value: 5000
              config:
                severity: warn

# ------- fct_reviews -------

  - name: fct_reviews
    columns:

      - name: listing_id
        data_tests:
          - not_null
      
      - name: review_text
        data_tests:
          - not_null
      
      - name: review_sentiment
        data_tests:
          - accepted_values:
              arguments:
                values: ['positive', 'neutral', 'negative']

                
