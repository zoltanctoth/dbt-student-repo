models:
  - name: dim_listings_cleansed
    data_tests:
      - minimum_row_count:
          arguments:
            min_row_count: 1000
          severity: warn

    columns:
      - name: listing_id
        data_tests:
          - not_null
          - unique

      - name: host_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hosts_cleansed')
                field: host_id

      - name: room_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['Entire home/apt',
                          'Private room',
                          'Shared room',
                          'Hotel room']

      - name: minimum_nights
        description: '{{ doc("dim_listing_cleansed__minimum_nights") }}'
        data_tests:
          - positive_values

  - name: dim_hosts_cleansed
    description: This table contains the cleansed data for hosts.
    versions:
      - v: 1
        defined_in: dim_hosts_cleansed
        description: This version of the model uses 'Anonymous' as the default value for host_name
        deprecation_date: 2027-06-30
      - v: 2
        description: This version of the model uses 'N/A' as the default value for host_name instead of 'Anonymous'.
        columns:
          - include: '*'
            exclude: [host_name]
          - name: host_name
            description: The name of the host (N/A if not available)
            data_type: string
            constraints:
              - type: not_null
    latest_version: 2
    config:
      contract:
        enforced: true
    columns:
      - name: host_id
        description: The host's id. References the host table.
        data_type: integer
        data_tests:
          - not_null
          - unique

      - name: host_name
        description: The host's name. This is a string value.
        data_type: string
        data_tests:
          - not_null

      - name: is_superhost
        description: Whether the host is a superhost. This is a boolean value.
        data_type: string
        data_tests:
          - accepted_values:
              arguments:
                values: ['t', 'f']

      - name: created_at
        description: The date the host was created. This is a timestamp value.
        data_type: timestamp

      - name: updated_at
        description: The date the host was last updated. This is a timestamp value.
        data_type: timestamp


  - name: dim_listings_w_hosts
    tests:
      - dbt_expectations.expect_table_row_count_to_equal_other_table:
          compare_model: source('airbnb', 'listings')
    columns:
      - name: price
        tests:
          - dbt_expectations.expect_column_quantile_values_to_be_between:
              quantile: .99
              min_value: 50 # minimum value for the 99th percentile
              max_value: 500 # maximum value for the 99th percentile
          - dbt_expectations.expect_column_max_to_be_between:
              max_value: 5000 # maximum value for the max price 
              config:
                severity: warn
          - dbt_expectations.expect_column_values_to_be_of_type:
              column_type: number

  - name: fct_reviews
    columns:
      - name: listing_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_listings_cleansed')
                field: listing_id

      - name: review_sentiment
        data_tests:
          - accepted_values:
              arguments:
                values: ['positive', 'negative', 'neutral']

