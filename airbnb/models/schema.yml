models:
  - name: dim_listings_cleansed
    description: Cleansed table which contains Airbnb listings.
    data_tests:
      - minimum_row_count:
          arguments:
            min_row_count: 1000
    columns:
      - name: listing_id
        data_tests:
          - unique
          - not_null

      - name: host_id
        description: The hosts's id. References the host table.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hosts_cleansed')
                field: host_id

      - name: room_type
        description: Type of the apartment / room
        data_tests:
          - accepted_values:
              arguments:
                values: ['Entire home/apt',
                        'Private room',
                        'Shared room',
                        'Hotel room']
      - name: minimum_nights
        data_tests:
          - positive_values
      
  - name: dim_hosts_cleansed
    versions:
      - v: 1
        defined_in: dim_hosts_cleansed
        description: This version uses 'Anonymous' for null host names
      - v: 2
    latest_version: 1
    description: This version replaces null host names with 'N/A' instead of 'Anonymous'
    config: 
      contract:
        enforced: true
    columns:
      - name: host_id
        data_tests:
          - unique
          - not_null

      - name: host_name
        data_tests:
          - not_null

      - name: is_superhost
        description: The airbnb superhost status of the host
        data_tests:
          - accepted_values:
              arguments:
                values: ['t',
                         'n',
                        'f']
      - name: host_id
        data_type: integer
      - name: host_name
        data_type: string
      - name: is_superhost
        data_type: string
      - name: updated_at
        data_type: timestamp
      - name: created_at
        data_type: timestamp
  
  - name: dim_listings_w_hosts
    tests: 
      - dbt_expectations.expect_table_row_count_to_equal_other_table:
          compare_model: source('airbnb', 'listings')
    columns:
      - name: price
        tests: 
          - dbt_expectations.expect_column_quantile_values_to_be_between:
              quantile: 0.99
              min_value: 50
              max_value: 500
          - dbt_expectations.expect_column_max_to_be_between:
              min_value: 1
              max_value: 5000
              config: 
                severity: warn
          - dbt_expectations.expect_column_values_to_be_of_type:
              column_type: number



  