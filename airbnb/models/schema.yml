models:
  - name: dim_listings_cleansed
    description: "This model contains the cleansed listings data for the Airbnb project."
    data_tests:
      - minimum_row_count:
          arguments:
            min_row_count: 1000
          config:
            severity: error

    columns:
      - name: listing_id
        description: "The unique identifier for the listing."
        data_tests:
          - not_null
          - unique
      - name: host_id
        description: "The unique identifier for the host associated with the listing."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hosts_cleansed')
                field: host_id
      - name: room_type
        description: "The type of room offered in the listing (e.g., Entire home/apt, Private room, Shared room)."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Entire home/apt', 
                  'Private room', 
                  'Shared room', 
                  'Hotel room']
      - name: minimum_nights
        description: "{{doc('dim_listing_cleansed__minimum_nights') }}"
        data_tests:
          - positive_values
  
  - name: dim_hosts_cleansed
    versions:
      - v: 1
        defined_in: dim_hosts_cleansed
        deprecation_date: 2026-07-30
      - v: 2
        columns:
          - include: '*'
            exclude: [host_name]
          - name: host_name
            description: The name of the host (N/A if not available)
            data_type: string
            constraints:
              - type: not_null
    latest_version: 2
    description: "This model contains the cleansed hosts data for the Airbnb project."
    config:
      contract:
        enforced: true
    columns:
      - name: host_id
        description: "The unique identifier for the host."
        data_type: integer
        constraints:
          - type: not_null
        data_tests:
          - not_null
          - unique
      - name: host_name
        description: "The name of the host."
        data_type: string
        data_tests:
          - not_null
      - name: is_superhost
        description: "Indicates whether the host is a superhost (True/False)."
        data_type: string
        data_tests:
          - accepted_values:
              arguments:
                values: ['t', 'f']
      - name: updated_at
        description: "The timestamp indicating when the host information was last updated."
        data_type: timestamp
      - name: created_at
        description: "The timestamp indicating when the host information was created."
        data_type: timestamp

  - name: dim_listings_w_hosts
    description: "This model combines listings and hosts data for the Airbnb project."
    tests:
      - dbt_expectations.expect_table_row_count_to_equal_other_table:
          arguments:
            compare_model: source('airbnb', 'listings')
    columns:
      - name: price
        description: "The price of the listing."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_of_type:
              arguments:
                column_type: number
          - dbt_expectations.expect_column_quantile_values_to_be_between:
              arguments:
                quantile: .99
                min_value: 50
                max_value: 500
          - dbt_expectations.expect_column_max_to_be_between:
              arguments:
                max_value: 5000
              config:
                severity: warn
                
  - name: fct_reviews
    description: "This model contains the fact table for reviews in the Airbnb project."
    columns:
      - name: listing_id
        description: "The unique identifier for the listing associated with the review."
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_listings_cleansed')
                field: listing_id
      - name: reviewer_name
        description: "The name of the reviewer."
        data_tests:
          - not_null
      - name: review_sentiment
        description: "The sentiment of the review (e.g., positive, negative, neutral)."
        data_tests:
          - accepted_values:
              arguments:
                values: ['positive', 'negative', 'neutral']
