name: PR slim CI (defer to prod artifact)

on:
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read
  actions: read

jobs:
  slim-ci:
    name: Build modified with defer to prod artifact
    if: github.repository != 'zoltanctoth/complete-dbt-bootcamp-zero-to-hero'
    runs-on: ubuntu-latest
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      DBT_USER: ${{ secrets.DBT_USER }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      PRIVATE_KEY_PASSPHRASE: ${{ secrets.PRIVATE_KEY_PASSPHRASE }}

    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - run: uv python install 3.13
      - run: uv sync
      - name: Set DBT_ENV_NAME from branch (uppercase, _ for / and -)
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          SANITIZED=$(echo "$HEAD_REF" | tr '/-' '__' | tr '[:lower:]' '[:upper:]')
          echo "DBT_ENV_NAME=$SANITIZED" >> "$GITHUB_ENV"
          echo "PR will build into schema: DBT_$SANITIZED"
      - name: Check secrets format (no key content printed)
        run: |
          echo "$PRIVATE_KEY" | head -1
          echo "$PRIVATE_KEY" | tail -1
          echo "lignes: $(echo "$PRIVATE_KEY" | wc -l)"
          test -n "$DBT_USER" && echo "DBT_USER ok"
      - run: cd airbnb && uv run dbt deps --profiles-dir _prod_profiles --target dev
      - name: Download latest prod-target artifact from main
        uses: dawidd6/action-download-artifact@v21
        with:
          workflow: prod-build.yml
          branch: main
          name: prod-target
          path: airbnb/prod-target
          if_no_artifact_found: fail
      - name: dbt build (slim CI)
        run: |
          cd airbnb
          uv run dbt build --profiles-dir _prod_profiles --target dev \
            --select state:modified+ --defer --state ./prod-target